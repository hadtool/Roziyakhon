<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фаг-хакер — мини-игра про вирусы</title>
<meta name="theme-color" content="#0B1D26">
<style>
:root{
  --bg:#0B1D26; --card:#12303d; --card2:#183b4a; --ink:#EAF4F1; --muted:#9CB8BF;
  --lime:#B6F24A; --coral:#F25C54; --amber:#FFC857; --purple:#8C6CFF; --teal:#0E7C7B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Calibri,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
body{min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:14px 16px 28px}
h1{font-family:Cambria,Georgia,serif;font-size:34px;line-height:1.1;margin:8px 0 6px}
h2{font-family:Cambria,Georgia,serif;font-size:22px;margin:10px 0 4px}
p{margin:6px 0;line-height:1.45}
.lead{color:var(--muted);font-size:16px}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:26px;height:8px;border-radius:5px;background:#1d4352;display:block}
.dots i.done{background:var(--lime)}
.dots i.on{background:var(--amber)}
.score b{color:var(--lime);font-size:16px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:19px;font-weight:700;
  background:var(--lime);color:#0B1D26;margin-top:14px;cursor:pointer;min-height:56px}
.btn:active{transform:scale(.97)}
.btn.coral{background:var(--coral);color:#fff}
.btn.ghost{background:transparent;border:2px solid #2a5566;color:var(--ink)}
.panel{background:var(--card);border-radius:18px;padding:14px;margin-top:12px}
.row{display:flex;gap:10px;margin-top:12px}
.cell{flex:1;background:var(--card);border:2px solid #24536a;border-radius:16px;padding:8px 4px 10px;color:inherit;cursor:pointer}
.cell:active{transform:scale(.96)}
.cell svg{width:100%;height:auto;display:block}
.rec{display:flex;justify-content:center;margin-bottom:-6px}
.bar{height:22px;border-radius:12px;background:#0a1820;overflow:hidden;border:2px solid #24536a;position:relative}
#fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--lime));width:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{height:74px;border-radius:14px;background:#0f2833;border:2px dashed #24536a;display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:700;font-size:14px;padding:4px;color:var(--ink)}
.tile.on{background:var(--card2);border:2px solid var(--amber);cursor:pointer;animation:pop .18s ease-out}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:7px 11px;border-radius:20px;background:#0f2833;border:2px solid #24536a;font-size:14px;color:var(--muted)}
.chip.ok{background:rgba(182,242,74,.15);border-color:var(--lime);color:var(--lime)}
.shake{animation:shake .35s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{background:var(--card2);border:2px solid #2a5566;border-radius:14px;padding:16px 8px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;min-height:64px}
.opt.used{opacity:.25;pointer-events:none}
.zone{position:absolute;top:0;bottom:0;background:rgba(182,242,74,.75)}
.marker{position:absolute;top:0;bottom:0;width:8px;background:#fff;border-radius:4px;box-shadow:0 0 8px #fff;z-index:2}
.stage{background:var(--card);border-radius:18px;padding:8px;margin-top:10px;text-align:center}
.stage svg{max-width:100%;height:auto}
.modal{position:fixed;inset:0;background:rgba(5,14,19,.82);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:9}
.modal .box{background:var(--card);border-radius:22px;padding:20px;max-width:520px;width:100%;animation:up .25s ease-out}
.plus{font-family:Cambria,Georgia,serif;font-size:40px;color:var(--lime);font-weight:700}
.fact{background:#0f2833;border-radius:14px;padding:12px;margin-top:10px;color:var(--ink);font-size:15px;line-height:1.45}
.fact b{color:var(--amber)}
.big{font-family:Cambria,Georgia,serif;font-size:64px;color:var(--lime);font-weight:700;text-align:center;line-height:1}
.rank{text-align:center;font-size:22px;font-weight:700;color:var(--amber);margin-top:6px}
.list{margin:10px 0 0;padding:0;list-style:none}
.list li{padding:6px 0;border-bottom:1px solid #1d4352;font-size:15px;display:flex;justify-content:space-between}
.list li span:last-child{color:var(--lime);font-weight:700}
.toast{color:var(--coral);font-weight:700;text-align:center;min-height:22px;margin-top:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const app = document.getElementById("app");
let timers = [];
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
const every = (ms, fn) => { const t = setInterval(fn, ms); timers.push(t); return t; };
const clearAll = () => { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const shake = el => { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); buzz(60); };

const S = { lvl: 0, total: 0, res: [] };
const NAMES = ["Прикрепление", "Проникновение", "Биосинтез", "Сборка", "Выход"];

/* ---------- SVG helpers ---------- */
function shapeSVG(k, color, size) {
  const body = {
    tri: '<polygon points="12,3 22,21 2,21"/>',
    circ: '<circle cx="12" cy="12" r="9"/>',
    sq: '<rect x="3" y="3" width="18" height="18" rx="2"/>'
  }[k];
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" style="vertical-align:middle">${body}</svg>`;
}
function bacteriumSVG() {
  return `<svg viewBox="0 0 160 84"><rect x="6" y="14" width="148" height="62" rx="31" fill="#DDF4EE" stroke="#0E7C7B" stroke-width="5"/>
  <rect x="12" y="20" width="136" height="50" rx="25" fill="none" stroke="#7BC8BB" stroke-width="2"/>
  <path d="M52 48 q10 -22 20 0 t20 0 t18 0" stroke="#2F6DB5" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
}
function phageInner(o = {}) {
  const m = "#6C4BD6", l = "#B7A4FF";
  const op = k => (o[k] === false ? ' opacity=".12"' : "");
  let ridges = "";
  for (let y = 126; y < 238; y += 9) ridges += `<line x1="90" y1="${y}" x2="110" y2="${y}" stroke="${m}" stroke-width="2"/>`;
  return `<g stroke-linecap="round" stroke-linejoin="round">
  <g${op("fibers")}><path d="M100 252 L100 292" stroke="${m}" stroke-width="5" fill="none"/>
  <path d="M70 252 L42 288 L16 302 M82 256 L66 304 L56 328 M118 256 L134 304 L144 328 M130 252 L158 288 L184 302" stroke="${m}" stroke-width="5" fill="none"/></g>
  <g${op("tail")}><rect x="90" y="120" width="20" height="122" fill="${l}" stroke="${m}" stroke-width="3"/>${ridges}
  <polygon points="74,240 126,240 138,256 62,256" fill="${m}"/><rect x="84" y="114" width="32" height="10" rx="3" fill="${m}"/></g>
  <g${op("head")}><polygon points="100,8 152,36 152,88 100,116 48,88 48,36" fill="${l}" stroke="${m}" stroke-width="5"/>
  <path d="M48 36 L152 88 M152 36 L48 88 M100 8 L100 116" stroke="${m}" stroke-width="2" opacity=".45" fill="none"/></g>
  <g${op("dna")}><path d="M68 62 q8 -16 16 0 t16 0 t16 0 t16 0" stroke="#FFC857" stroke-width="5" fill="none"/>
  <path d="M68 80 q8 -16 16 0 t16 0 t16 0 t16 0" stroke="#FFC857" stroke-width="5" fill="none"/></g></g>`;
}
function phageSVG(o, h) { return `<svg viewBox="0 0 200 340" height="${h || 200}">${phageInner(o)}</svg>`; }

/* ---------- shared UI ---------- */
function hud() {
  let d = "";
  for (let i = 1; i <= 5; i++) d += `<i class="${i < S.lvl ? "done" : i === S.lvl ? "on" : ""}"></i>`;
  return `<div class="hud"><div class="dots">${d}</div><div class="score">Очки: <b>${S.total}</b></div></div>`;
}
function head(n, lead) {
  return `<h2>Уровень ${n} · ${NAMES[n - 1]}</h2><p class="lead">${lead}</p>`;
}
function finish(points, fact, next) {
  clearAll();
  S.total += points; S.res.push(points);
  const last = S.lvl === 5;
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="box"><div class="plus">+${points}</div><h2>Этап «${NAMES[S.lvl - 1]}» пройден!</h2>
  <div class="fact"><b>Запомни:</b> ${fact}</div>
  <button class="btn">${last ? "Узнать результат" : "Дальше"}</button></div>`;
  document.body.appendChild(m);
  m.querySelector(".btn").onclick = () => { m.remove(); next(); };
}

/* ---------- start ---------- */
function start() {
  clearAll(); S.lvl = 0; S.total = 0; S.res = [];
  app.innerHTML = `<div style="text-align:center;margin-top:8px">${phageSVG({}, 170)}</div>
  <h1>Фаг-хакер</h1>
  <p class="lead">Ты — бактериофаг: вирус, который заражает бактерии. Пройди 5 этапов и взломай клетку.</p>
  <div class="panel"><p>Прикрепись, впрысни ДНК, заставь клетку работать на себя, собери копии и вырвись на свободу.</p>
  <p class="lead">Игра по теме презентации «Вирусы — неклеточные формы жизни».</p></div>
  <button class="btn" id="go">Начать заражение</button>`;
  document.getElementById("go").onclick = level1;
}

/* ---------- level 1: attach ---------- */
function level1() {
  clearAll(); S.lvl = 1;
  let round = 0, miss = 0;
  const shapes = ["tri", "circ", "sq"];
  const col = { tri: "#FFC857", circ: "#FFC857", sq: "#FFC857" };
  function nextRound() {
    const want = shapes[Math.floor(Math.random() * 3)];
    const order = shuffle(shapes.slice());
    app.innerHTML = hud() + head(1, `Нити фага подходят только к рецептору ${shapeSVG(want, "#FFC857", 22)} — как ключ к замку. Выбери нужную клетку. Раунд ${round + 1} из 3.`) +
      `<div class="stage">${phageSVG({}, 150)}</div>
      <div class="row">${order.map(k => `<button class="cell" data-k="${k}"><div class="rec">${shapeSVG(k, col[k], 34)}</div>${bacteriumSVG()}</button>`).join("")}</div>
      <div class="toast" id="toast"></div>`;
    app.querySelectorAll(".cell").forEach(b => b.onclick = () => {
      if (b.dataset.k === want) {
        round++;
        if (round >= 3) finish(Math.max(30, 100 - miss * 20), "вирусы избирательны: шипы и нити подходят только к «своим» рецепторам, поэтому вирус растений безопасен для человека.", level2);
        else nextRound();
      } else {
        miss++; shake(b);
        document.getElementById("toast").textContent = "Не подходит! Фаг не прикрепился.";
      }
    });
  }
  nextRound();
}

/* ---------- level 2: inject ---------- */
function level2() {
  clearAll(); S.lvl = 2;
  let p = 0, t = 12, fails = 0;
  app.innerHTML = hud() + head(2, "Фермент прорезал стенку. Жми «Впрыскивай!» как можно быстрее — клетка сопротивляется и выталкивает ДНК обратно.") +
    `<div class="stage"><svg viewBox="0 0 300 250" width="100%">
      <rect x="20" y="130" width="260" height="100" rx="50" fill="#DDF4EE" stroke="#0E7C7B" stroke-width="7"/>
      <g transform="translate(125,0) scale(.38)">${phageInner({ dna: false })}</g>
      <path id="dnaPath" pathLength="100" d="M150 45 L150 125 q-18 16 0 30 t0 30 t26 14 t40 -4" stroke="#FF8A00" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="0 100"/>
    </svg></div>
    <div class="bar"><div id="fill"></div></div>
    <p class="lead" style="text-align:center">Осталось секунд: <b id="tm">12</b></p>
    <div class="toast" id="toast"></div>
    <button class="btn coral" id="tap">Впрыскивай!</button>`;
  const fill = document.getElementById("fill"), path = document.getElementById("dnaPath"), tm = document.getElementById("tm");
  const upd = () => { fill.style.width = p + "%"; path.setAttribute("stroke-dasharray", `${p} 100`); };
  document.getElementById("tap").onclick = () => {
    p = Math.min(100, p + 7); buzz(15); upd();
    if (p >= 100) finish(Math.max(30, 100 - fails * 25), "капсид остаётся снаружи — внутрь клетки попадает только ДНК вируса.", level3);
  };
  every(100, () => { p = Math.max(0, p - 0.9); upd(); });
  every(1000, () => {
    t--; tm.textContent = t;
    if (t <= 0) { fails++; t = 12; p = 0; upd(); tm.textContent = t; document.getElementById("toast").textContent = "Клетка отбилась! Пробуй ещё раз."; }
  });
}

/* ---------- level 3: biosynthesis ---------- */
function level3() {
  clearAll(); S.lvl = 3;
  const need = ["ДНК фага", "Белок головки", "Белок хвоста", "Белок нитей"];
  const decoy = ["Хлорофилл", "Гемоглобин", "Антитела", "Инсулин", "Шерсть", "Хитин"];
  const got = new Set(); let mistakes = 0;
  app.innerHTML = hud() + head(3, "Клетка-хозяин теперь работает на вирус. Лови детали фага, пока они появляются. Лишнее не трогай!") +
    `<div class="chips" id="chips">${need.map(n => `<span class="chip" data-n="${n}">${n}</span>`).join("")}</div>
    <div class="tiles" id="tiles">${Array.from({ length: 12 }, () => '<div class="tile"></div>').join("")}</div>
    <div class="toast" id="toast"></div>`;
  const tiles = [...document.querySelectorAll(".tile")];
  const clear = (el) => { el.className = "tile"; el.textContent = ""; el.dataset.n = ""; el.onclick = null; };
  every(650, () => {
    const free = tiles.filter(el => !el.dataset.n);
    if (!free.length) return;
    const el = free[Math.floor(Math.random() * free.length)];
    const left = need.filter(n => !got.has(n));
    const name = (left.length && Math.random() < 0.55) ? left[Math.floor(Math.random() * left.length)] : decoy[Math.floor(Math.random() * decoy.length)];
    el.className = "tile on"; el.textContent = name; el.dataset.n = name;
    el.onclick = () => {
      if (need.includes(name)) {
        got.add(name); clear(el);
        document.querySelector(`.chip[data-n="${name}"]`).classList.add("ok");
        if (got.size === need.length) finish(Math.max(30, 100 - mistakes * 12), "у вируса нет своих рибосом — белки он строит на рибосомах клетки-хозяина.", level4);
      } else {
        mistakes++; shake(el); clear(el);
        document.getElementById("toast").textContent = "Это не деталь фага!";
      }
    };
    later(() => { if (el.dataset.n === name) clear(el); }, 1500);
  });
}

/* ---------- level 4: assembly ---------- */
function level4() {
  clearAll(); S.lvl = 4;
  const steps = [
    { t: "Собрать головку", show: { head: true, dna: false, tail: false, fibers: false } },
    { t: "Упаковать ДНК", show: { head: true, dna: true, tail: false, fibers: false } },
    { t: "Присоединить хвост", show: { head: true, dna: true, tail: true, fibers: false } },
    { t: "Добавить нити", show: { head: true, dna: true, tail: true, fibers: true } },
  ];
  let idx = 0, mistakes = 0;
  const order = shuffle(steps.map((s, i) => i));
  app.innerHTML = hud() + head(4, "Собери нового фага из деталей. Нажимай шаги в правильном порядке: от головки до нитей.") +
    `<div class="stage" id="stg">${phageSVG({ head: false, dna: false, tail: false, fibers: false }, 230)}</div>
    <div class="opts">${order.map(i => `<button class="opt" data-i="${i}">${steps[i].t}</button>`).join("")}</div>
    <div class="toast" id="toast"></div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (i === idx) {
      b.classList.add("used"); buzz(20);
      document.getElementById("stg").innerHTML = phageSVG(steps[i].show, 230);
      idx++;
      document.getElementById("toast").textContent = "";
      if (idx >= steps.length) later(() => finish(Math.max(30, 100 - mistakes * 20), "новые фаги собираются сами из готовых деталей — как конструктор.", level5), 500);
    } else {
      mistakes++; shake(b);
      document.getElementById("toast").textContent = "Не сейчас! Подумай, что собирается раньше.";
    }
  });
}

/* ---------- level 5: lysis ---------- */
function level5() {
  clearAll(); S.lvl = 5;
  let pos = 0, dir = 1, speed = 1.6, miss = 0;
  const zoneW = 20, zoneX = 20 + Math.random() * 55;
  app.innerHTML = hud() + head(5, "Новых фагов уже сотни. Белая полоска бегает по шкале. Нажми «Лизис!» в тот момент, когда она в зелёной зоне, — и клетка лопнет.") +
    `<div class="stage"><svg viewBox="0 0 300 160" width="100%">
      <rect id="cellR" x="30" y="40" width="240" height="90" rx="45" fill="#DDF4EE" stroke="#0E7C7B" stroke-width="7"/>
      <g id="inside"></g></svg></div>
    <div class="bar" style="margin-top:18px"><div class="zone" style="left:${zoneX}%;width:${zoneW}%"></div><div class="marker" id="mk" style="left:0"></div></div>
    <div class="toast" id="toast"></div>
    <button class="btn coral" id="lys">Лизис!</button>`;
  const inside = document.getElementById("inside");
  let s = "";
  for (let i = 0; i < 14; i++) {
    const x = 70 + (i % 7) * 26, y = 62 + Math.floor(i / 7) * 36;
    s += `<g transform="translate(${x},${y}) scale(.11)">${phageInner({})}</g>`;
  }
  inside.innerHTML = s;
  const mk = document.getElementById("mk");
  every(16, () => { pos += dir * speed * 0.55; if (pos >= 98) { pos = 98; dir = -1; } if (pos <= 0) { pos = 0; dir = 1; } mk.style.left = pos + "%"; });
  document.getElementById("lys").onclick = () => {
    if (pos >= zoneX - 1 && pos <= zoneX + zoneW) {
      document.getElementById("cellR").setAttribute("stroke-dasharray", "22 14");
      finish(Math.max(30, 100 - miss * 20), "лизис — клетка лопается, и на свободу выходят 100–200 новых фагов. Каждый ищет новую жертву.", result);
    } else {
      miss++; speed += 0.5; shake(document.getElementById("lys"));
      document.getElementById("toast").textContent = "Мимо! Клетка ещё держится.";
    }
  };
}

/* ---------- result ---------- */
function result() {
  clearAll(); S.lvl = 6;
  const n = 100 + Math.round(S.total / 5);
  const rank = S.total >= 450 ? "Профессор вирусологии" : S.total >= 350 ? "Бактериофаг-мастер" : S.total >= 220 ? "Опытный фаг" : "Фаг-стажёр";
  app.innerHTML = `<div style="text-align:center;margin-top:6px">${phageSVG({}, 120)}</div>
  <h2 style="text-align:center">Клетка взломана!</h2>
  <p class="lead" style="text-align:center">Из одной бактерии вышло новых фагов:</p>
  <div class="big" id="cnt">0</div>
  <div class="rank">${rank}</div>
  <p class="lead" style="text-align:center">Всего очков: <b style="color:var(--lime)">${S.total}</b> из 500</p>
  <ul class="list">${S.res.map((r, i) => `<li><span>${i + 1}. ${NAMES[i]}</span><span>${r}</span></li>`).join("")}</ul>
  <div class="fact"><b>Итог:</b> вирус не растёт и не питается сам — он только «заказывает» копии у клетки-хозяина. Поэтому вирусы размножаются лишь внутри живых клеток.</div>
  <button class="btn" id="again">Играть заново</button>`;
  let c = 0;
  every(25, () => { c = Math.min(n, c + Math.ceil(n / 40)); document.getElementById("cnt").textContent = c; });
  document.getElementById("again").onclick = start;
}

start();
</script>
</body>
</html>
